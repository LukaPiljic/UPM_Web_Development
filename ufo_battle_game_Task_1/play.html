<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Play — UFO Battle</title>
    <meta name="color-scheme" content="dark light">

    <!-- To set the theme as fast as possible to avoid flash of wrong theme -->
    <script src="js/theme-boot.js"></script>

    <link rel="stylesheet" href="css/style.css">

    <!-- Icons (Font Awesome) -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          referrerpolicy="no-referrer"/>

    <!-- Inject the shared topbar into #topbar on every page -->
    <script src="js/topbar.js"></script>

    <script defer src="js/api.js"></script>
    <script defer src="js/app.js"></script>
</head>

<body>
<div class="wrap">

    <!-- Shared navigation bar gets injected here by js/topbar.js -->
    <div id="topbar"></div>


    <div class="card play-wrap">
        <aside class="score-panel">
            <div><strong>Time left</strong>: <span id="hudTime">60</span>s</div>
            <div><strong>Punctuation</strong>: <span id="hudScore">0</span></div>
            <div><strong>UFOs</strong>: <span id="hudUfos">0</span></div>
            <div><strong>Speed</strong>: <span id="hudSpeed">1x</span></div>
            <hr>
            <div class="hint">
                Controls:
                <span class="kbd">←</span>/<span class="kbd">→</span> or <span class="kbd">A</span>/<span
                    class="kbd">D</span> to move (before firing).
                <span class="kbd">Space</span> to shoot. <span class="kbd">R</span> restart.
            </div>
            <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
                <button class="btn" id="btnRestart">
                    <i class="fa-solid fa-rotate-right" aria-hidden="true" style="margin-right:.4rem"></i>
                    Restart
                </button>
            </div>
        </aside>

        <div class="canvas-wrap">
            <canvas id="game" width="800" height="520"></canvas>
            <div id="overlayEnd" class="overlay">
                <div class="card endcard" style="text-align:center;max-width:460px;">
                    <h3>Time’s up!</h3>
                    <p><strong id="finalScore" class="final-score"></strong></p>
                    <div class="end-actions">
                        <button class="btn primary" id="btnPlayAgain">
                            <i class="fa-solid fa-gamepad" aria-hidden="true" style="margin-right:.4rem"></i>
                            Play again
                        </button>
                        <a class="btn" href="preferences.html">
                            <i class="fa-solid fa-sliders" aria-hidden="true" style="margin-right:.4rem"></i>
                            Edit preferences
                        </a>
                        <button class="btn" id="btnSaveRecord" style="display:none;">
                            <i class="fa-solid fa-cloud-arrow-up" aria-hidden="true" style="margin-right:.4rem"></i>
                            Save my record
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="js/game.js"></script>

    <footer>© UPM – Web Development Practical · UFO Battle</footer>
</div>
</body>
</html>
