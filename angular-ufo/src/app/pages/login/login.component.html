<div class="card brand">
  <div class="auth-card login">
    <h3 style="margin-top:0">User identification</h3>

    <div class="row">
      <label for="username">User</label>
      <input type="text" id="username" [(ngModel)]="username" placeholder="username">
    </div>

    <div class="row">
      <label for="password">Password</label>
      <input type="password" id="password" [(ngModel)]="password" placeholder="password">
    </div>

    <div class="row actions">
      <button class="btn primary" (click)="doLogin()">
        <i class="fa-solid fa-right-to-bracket" style="margin-right:.4rem"></i>
        Send
      </button>
    </div>

    <div class="hint" *ngIf="msg" style="color: orange; margin-top: 10px;">
      {{ msg }} <!-- printet dann die err-Message -->
    </div>

    <div class="hint" style="margin-top: 10px;">
      Test users: <strong>user1/user1</strong> or <strong>user2/user2</strong>.
    </div>
  </div>
</div>
